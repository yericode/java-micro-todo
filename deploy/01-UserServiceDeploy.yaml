apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: user-service
      role: backend
  template:
    metadata:
      labels:
        app: user-service
        role: backend
    spec:
      terminationGracePeriodSeconds: 40
      volumes:
        - name: app-log
          emptyDir: 
            sizeLimit: 2Gi
      containers:
        - name: user-service
          image: user-service:0.0.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: DATASOURCE_DB_USER
          volumeMounts:
            - name: app-log
              mountPath: /var/log/app
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 3Gi
          ports:
            - containerPort: 8078
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8078
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8078
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8078
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 5
