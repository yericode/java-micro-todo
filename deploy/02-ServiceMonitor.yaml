apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: default
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: user-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-service
  namespace: default
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: todo-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s      