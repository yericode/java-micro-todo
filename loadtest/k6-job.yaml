apiVersion: batch/v1
kind: Job
metadata:
  name: k6
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      volumes: 
        - name: scripts
          configMap:
            name: k6-scripts
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/load.js"]
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
