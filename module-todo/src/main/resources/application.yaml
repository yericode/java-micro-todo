server:
  port: 8079
  shutdown: graceful
spring:
  application:
    name: todo-service
  http:
    client:
      factory: http-components        # 使用 Apache HttpClient5
      connect-timeout: 2s
      read-timeout: 5s    
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://localhost:3306/DB_TODO
    username: root
    password: password
  mvc:
    problemdetails:
      enabled: true

logging:
  level:
    root: info
  structured:
    format:
      console: "" # 本地預設用回一般格式
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:yyyy-MM-dd HH:mm:ss}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

management:
  endpoint:
    health:
      show-details: always  # 加：health 端點才會顯示是哪個 indicator 掛了
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}    # ← 每個指標自動帶上服務名
  observations:
    key-values:
      application: ${spring.application.name}
  
  metrics.distribution:
    percentiles-histogram:
      http.server.requests: true
    slo:
      http.server.requests: 100ms,300ms,1s
    minimum-expected-value:
      http.server.requests: 10ms
    maximum-expected-value:
      http.server.requests: 5s
  

services:
  user-service:
    uri: http://localhost:8078
  todo-service:
    uri: http://localhost:8079